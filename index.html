<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saylani Welfare - Log into your Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card-container">

        <!-- Left Section: Login Form -->
        <div class="left-section">

            <!-- Saylani Logo & Header -->
            <div class="logo-container">

                <div class="logo-box">
                    <img src="Logo.png" class="logo">
                </div>

                <!-- Page Title -->
                <h1 class="form-title">Log into your Account</h1>
                <form>
                    <!-- Email Input (Highlighted with red accent border as in source image) -->
                    <div class="form-group">
                        <img src="message.png" class="message-pp" alt="">
                        <input type="email" class="input-box" placeholder="Email address" required />
                    </div>
                

                    <!-- Password Input -->
                    <div class="form-group">
                        <img src="password.png" class="message-pp" alt="">
                        <input type="password" id="passwordInput" class="input-box" placeholder="Password" required />
                    </div>

                    <!-- Forgot Password -->
                    <div class="forgot-pass-wrapper">
                        <a href="#" class="forgot-pass-link">Forgot Password?</a>
                    </div>

                    <!-- Main Sign In Button -->
                    <button type="submit" class="btn-primary">Sign in</button>

                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Social Logins -->
                <div class="social-buttons">
                    <a href="#"><button class="btn-social" type="button">
                        <img src="google.png" alt="" height="20px" width="20px">Sign in with Google
                    </button></a>
                    <a href="#"><button class="btn-social" type="button">
                        <img src="fb.png" alt="" height="20px" width="20px">
                        Sign in with Facebook
                    </button></a>
                    <a href="#"><button class="btn-social" type="button" >
                        <img src="image.png" alt="" height="30px" width="30px">
                        Sign in with Apple
                    </button></a>
                </div>

                <!-- Sign Up Footer -->
                <div class="form-footer">
                    Don't have an account? <a href="#" class="signup-link">Create Account</a>
                </div>

            </div>

            <!-- Right Section: Classroom Study Image -->
            <div class="right-section">
                <img src="right.jpg" alt="Online Learning Desk Setup" class="bg-image" />
            </div>

        </div>

</body>

</html>
